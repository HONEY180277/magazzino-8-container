
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b68">
<title>Magazzino</title>

<style>
:root {
  --blu:#123b68;
  --blu2:#1d5b96;
  --sfondo:#f2f5f9;
  --bianco:#fff;
  --testo:#172b42;
  --bordo:#dce4ed;
  --verde:#168653;
  --rosso:#c83d48;
}

* { box-sizing:border-box; }

.hidden {
  display:none !important;
}

body {
  margin:0;
  background:var(--sfondo);
  color:var(--testo);
  font-family:Arial,sans-serif;
  font-size:16px;
}

header {
  background:var(--blu);
  color:white;
  padding:22px 18px;
}

header h1 {
  margin:0;
  font-size:25px;
}

header p {
  margin:6px 0 0;
  opacity:.85;
  font-size:14px;
}

main {
  width:100%;
  max-width:850px;
  margin:auto;
  padding:15px;
}

section, .panel {
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 3px 14px rgba(22,40,60,.06);
}

h2 {
  margin:0 0 14px;
  color:var(--blu);
  font-size:20px;
}

h3 {
  margin:0 0 12px;
  font-size:18px;
}

input, select, textarea {
  width:100%;
  min-height:48px;
  padding:12px;
  margin:5px 0 12px;
  border:1px solid var(--bordo);
  border-radius:10px;
  background:white;
  color:var(--testo);
  font-size:16px;
}

textarea {
  min-height:75px;
  resize:vertical;
}

label {
  display:block;
  font-weight:600;
  font-size:14px;
  margin-top:5px;
}

button {
  min-height:46px;
  padding:11px 16px;
  border:0;
  border-radius:10px;
  background:var(--blu2);
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
}

button:active { opacity:.8; }

button.secondary {
  background:#e8eef5;
  color:var(--blu);
}

button.danger { background:var(--rosso); }
button.success { background:var(--verde); }

.actions {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.actions button { flex:1; }

.search-area {
  margin-bottom:15px;
}

.search-buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.search-buttons button {
  min-height:50px;
  font-size:16px;
}

.container-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.container-grid > * {
  min-width:0;
}

#containers {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

#containers button {
  width:100%;
  min-height:105px;
  padding:14px 8px;
  font-size:17px;
  background:white;
  color:var(--blu);
  border:2px solid var(--bordo);
  border-radius:14px;
}

#containers button:active {
  background:#eaf2fb;
}

#materials {
  display:grid;
  gap:10px;
}

#materials > * {
  min-width:0;
}

.material-card, .material, .item {
  padding:13px;
  border:1px solid var(--bordo);
  border-radius:12px;
  background:white;
  overflow-wrap:anywhere;
}

#resultcount {
  margin:10px 0;
  color:#5b6d80;
  font-size:14px;
}

.form-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 12px;
}

#status, #authmsg, #pinmsg {
  font-size:14px;
  margin:8px 0;
}

#auth, #app { margin-top:15px; }

#logout {
  background:#e8eef5;
  color:var(--blu);
}

#movements {
  overflow-wrap:anywhere;
}

.container-card {
  min-height:120px;
  padding:18px 10px;
  border:2px solid #dce4ed;
  border-radius:14px;
  background:white;
  text-align:center;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:17px;
}

.container-card b {
  font-size:23px;
  color:#123b68;
}

.container-card button {
  width:100%;
  min-height:42px;
}

@media(max-width:480px) {
  main { padding:11px; }
  header { padding:20px 15px; }
  section, .panel { padding:14px; }
  .form-grid { grid-template-columns:1fr; }
  button { padding:11px 12px; }
}
</style>
</head>

<body>

<header>
  <h1>MAGAZZINO</h1>
  <p>Gestione materiali e container</p>
</header>

<main>

<div id="status"></div>

<section id="auth">
  <h2>Accesso</h2>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">

  <button id="login" style="width:100%">ACCEDI</button>
  <div id="authmsg"></div>
</section>

<section id="pin" class="hidden">
  <h2 id="pintitle">PIN</h2>
  <div id="pinhelp"></div>

  <input id="pin1" type="password" inputmode="numeric" placeholder="Inserisci PIN">
  <input id="pin2" type="password" inputmode="numeric" placeholder="Ripeti PIN">

  <button id="pinbtn" style="width:100%">CONFERMA PIN</button>
  <div id="pinmsg"></div>
</section>

<div id="app" class="hidden">

  <section>
    <div class="actions">
      <button id="logout" class="secondary">ESCI</button>
    </div>
  </section>

  <section class="search-area">
    <h2>Cerca materiale</h2>
    <input id="search" type="search" placeholder="Nome, codice, container...">

    <div class="search-buttons">
      <button id="searchBtn">CERCA</button>
      <button id="clearSearch" class="secondary">PULISCI</button>
    </div>
  </section>

  <section>
    <h2>I tuoi container</h2>
    <div id="containers"></div>
  </section>

  <section>
    <h2 id="formtitle">Materiale</h2>
    <input id="docid" type="hidden">

    <label for="name">Nome materiale</label>
    <input id="name" placeholder="Nome materiale">

    <label for="code">Codice</label>
    <input id="code" placeholder="Codice">

    <div class="form-grid">
      <div>
        <label for="qty">Quantità</label>
        <input id="qty" type="number" step="any" placeholder="0">
      </div>

      <div>
        <label for="unit">Unità</label>
        <input id="unit" placeholder="Pezzi, kg, metri...">
      </div>
    </div>

    <label for="container">Container</label>
    <select id="container">
      <option value="C01">C01</option>
      <option value="C02">C02</option>
      <option value="C03">C03</option>
      <option value="C04">C04</option>
      <option value="C05">C05</option>
      <option value="C06">C06</option>
      <option value="C07">C07</option>
      <option value="C08">C08</option>
    </select>

    <div class="form-grid">
      <div>
        <label for="zone">Zona</label>
        <input id="zone">
      </div>

      <div>
        <label for="box">Scatola</label>
        <input id="box">
      </div>

      <div>
        <label for="shelf">Scaffale</label>
        <input id="shelf">
      </div>

      <div>
        <label for="rack">Ripiano</label>
        <input id="rack">
      </div>
    </div>

    <label for="notes">Note</label>
    <textarea id="notes"></textarea>

    <div class="actions">
      <button id="save" class="success">SALVA</button>
      <button id="cancel" class="secondary">ANNULLA</button>
    </div>
  </section>

  <section>
    <h2>Materiali</h2>
    <div id="resultcount"></div>
    <div id="materials"></div>
  </section>

  <section>
    <h2>Movimenti</h2>
    <div id="movements"></div>
  </section>

  <section>
    <h2>Backup</h2>
    <button id="export" style="width:100%">ESPORTA DATI JSON</button>
  </section>

</div>
</main>

<script type="module" src="app.js"></script>

</body>
</html>
